name: Update Latest Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - 36LJU22
          - 38LJE24
          # - 38LJE24-PICO2
          - 38LJU24
          # - 38LJU24-PICO2
          - RP2040_ZERO
          # - 11XGA24_1
          # - 11XGA24_2
          - LEO_V2
          - LEO_V3
          - LEO_V3_2040BT
          # - 09LJV23

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SDK versions from CMakeLists.txt
        id: sdk_versions
        run: |
          SDK_VERSION=$(grep -oP 'set\(sdkVersion \K[^\)]+' CMakeLists.txt)
          echo "sdk_version=$SDK_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Pico SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          cd $HOME
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git --branch ${{ steps.sdk_versions.outputs.sdk_version }}
          cd pico-sdk && git submodule update --init
          echo "PICO_SDK_PATH=$HOME/pico-sdk" >> $GITHUB_ENV

      - name: Extract firmware version
        id: fw_version
        run: |
          BASE_VERSION=$(grep -oP '#define FW_VER "\K[^"]+' src/g_config.h)
          VERSION_NO_V="${BASE_VERSION#v}"
          echo "version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "version_no_v=$VERSION_NO_V" >> $GITHUB_OUTPUT

      - name: Build firmware
        run: |
          BOARD_ENTRY="${{ matrix.board }}"
          if [[ "$BOARD_ENTRY" == *-PICO2 ]]; then
            BOARD_NAME="BOARD_${BOARD_ENTRY%-PICO2}"
            USE_PICO2=ON
          else
            BOARD_NAME="BOARD_${BOARD_ENTRY}"
            USE_PICO2=OFF
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBOARD=${BOARD_NAME} -DUSE_PICO2=${USE_PICO2}
          cmake --build build --parallel $(nproc)

      - name: Rename firmware for release
        run: |
          mv build/ZX_RGBI_TO_VGA_HDMI.uf2 "build/ZX_RGBI_TO_VGA_HDMI-${{ matrix.board }}-${{ steps.fw_version.outputs.version_no_v }}.uf2"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.board }}
          path: build/*.uf2
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract firmware version
        id: fw_version
        run: |
          BASE_VERSION=$(grep -oP '#define FW_VER "\K[^"]+' src/g_config.h)
          echo "version=$BASE_VERSION" >> $GITHUB_OUTPUT

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          pattern: fw-*
          merge-multiple: true

      - name: List firmware files
        run: ls -la firmware/

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Delete previous firmware assets
        run: |
          gh release view latest --json assets --jq '.assets[].name' 2>/dev/null | \
            grep '\.uf2$' | \
            while read -r asset; do
              echo "Deleting old asset: $asset"
              gh release delete-asset latest "$asset" --yes
            done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Development Build (${{ steps.fw_version.outputs.version }})
          body: |
            This is an automatically updated release that always points to the latest commit on the main branch.
            
            **Firmware Version:** ${{ steps.fw_version.outputs.version }}
            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}
            **Message:** ${{ github.event.head_commit.message }}
            
            ### Board Variants
            Each `.uf2` file is named `ZX_RGBI_TO_VGA_HDMI-<board>-<version>.uf2`.
            Download the file matching your board revision.
            
            ### Installation
            1. Download the `.uf2` file for your board
            2. Hold the BOOTSEL button on your Raspberry Pi Pico while connecting USB
            3. Drag and drop the `.uf2` file onto the RPI-RP2 drive
            
            To clone this version:
            ```bash
            git clone --branch latest https://github.com/${{ github.repository }}.git
            ```
          draft: false
          prerelease: false
          files: firmware/*.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
